<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOLO Live Detection</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0f172a;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 1100px;

            background: #111827;
            border-radius: 20px;

            padding: 30px;

            box-shadow:
                0 0 20px rgba(0,0,0,0.4),
                0 0 60px rgba(59,130,246,0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;

            font-size: 42px;
            font-weight: bold;

            color: #60a5fa;
        }

        p {
            text-align: center;
            margin-bottom: 25px;

            color: #cbd5e1;
            font-size: 18px;
        }

        .video-container {
            width: 100%;

            overflow: hidden;
            border-radius: 16px;

            border: 3px solid #3b82f6;

            background: black;
        }

        img {
            width: 100%;
            display: block;
        }

        .footer {
            margin-top: 20px;
            text-align: center;

            color: #94a3b8;
            font-size: 14px;
        }

        .status {
            display: inline-block;

            margin-top: 10px;
            padding: 8px 16px;

            border-radius: 999px;

            background: #16a34a;
            color: white;

            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>ถ่ายทอดสดจาก ฟุกุโอะกะ</h1>

        <p>
            โปรแกรมตรวจหสคนหน้าตาดี
        </p>

        <div style="text-align:center;">
            <span class="status">LIVE</span>
        </div>

        <br>

        <div class="video-container">
            <img src="{{ url_for('video') }}">
        </div>

        <div class="footer">
            Webcam AI Detection System
        </div>

    </div>

</body>
</html>
