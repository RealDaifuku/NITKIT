<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Camera YOLO</title>

    <style>
        body{
            background:#111827;
            color:white;
            font-family:Arial;
            text-align:center;
            padding:20px;
        }

        video, img{
            width:90%;
            max-width:700px;
            border-radius:20px;
            border:3px solid #3b82f6;
            margin-top:20px;
        }

        button{
            padding:15px 30px;
            border:none;
            border-radius:10px;
            background:#2563eb;
            color:white;
            font-size:18px;
            cursor:pointer;
        }

        .bottom_menu{
        display:flex;
        margin-top: 50px;
        gap:30px;
        flex-wrap:wrap;
        justify-content:center;
        background: #111827;
        }
        .button{
            width:80px;
            padding:10px;
            border-radius: 10px;
            background:#111827;
            border:2px solid #2563eb;
            transition:0.3s;
            cursor:pointer;
            text-decoration:none;
            color:white;
        }

        .button:hover{
            transform:translateY(-10px);
            color: #ff0000;
            background:#1e293b;
        }

        .button_text{
            font-size: 30px;
        }

        
    </style>
</head>
<body>

    <h1>YOLO Phone Camera Detection</h1>

    <button onclick="startCamera()">
        Start Camera
    </button>

    <br>

    <video id="video" autoplay playsinline></video>

    <img id="result">

    <div class="bottom_menu"> <button class="button" type="button" onclick="goHome()"> <div class="button_text"> back </div> </button> </div>

<script>

const video = document.getElementById("video");
const result = document.getElementById("result");

async function startCamera(){

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        alert("Camera API not supported or page not secure.");
        return;
    }

    try{

        const stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: "user"
            },
            audio:false
        });

        video.srcObject = stream;

        video.onloadedmetadata = () => {
            video.play();
            processFrames();
        };

    }
    catch(err){
        console.error(err);
        alert("Camera error: " + err.message);
    }

}

async function processFrames(){

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    setInterval(async ()=>{

        if(video.videoWidth === 0) return;

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        ctx.drawImage(video,0,0);

        const image = canvas.toDataURL("image/jpeg");

        try{

            const response = await fetch("/detect",{
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body: JSON.stringify({
                    image:image
                })
            });

            const data = await response.json();

            result.src = "data:image/jpeg;base64," + data.image;

        }
        catch(err){
            console.error(err);
        }

    }, 200);

}

function goHome(){
    window.location.href = "/";
}

</script>
</body>
</html>
